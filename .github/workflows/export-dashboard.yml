name: export-dashboard

on:
  workflow_dispatch:

concurrency:
  group: export-push
  cancel-in-progress: false

jobs:
  # Flusso storico: commit dei JSON su main, pubblicati da Pages "branch".
  # Resta attivo finché la variabile PAGES_SOURCE non vale "actions".
  export-dashboard:
    if: vars.PAGES_SOURCE != 'actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 10

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install supabase pandas numpy scipy python-dotenv requests matplotlib

      - name: Run dashboard export
        run: python3 scripts/export_static.py --dashboard-only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Commit and push dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/dashboard_data.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "chore: update dashboard data [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Tentativo $i fallito, retry in 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1

  # Nuovo flusso: nessun commit, deploy su Pages come artifact (publish.yml).
  publish:
    if: vars.PAGES_SOURCE == 'actions'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      mode: dashboard
    secrets: inherit

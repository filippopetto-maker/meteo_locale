name: Archivio radar DPC (Italia, celle 0,05°)

# Ogni giorno archivia i giorni completi del radar DPC SRI non ancora salvati (scripts/archivio_radar.py)
# e li carica come asset della release del mese (radar-AAAA-MM). L'API DPC tiene solo ~5–6 mesi:
# un giorno non archiviato in tempo si perde. Riprendibile: salta i giorni già caricati, al massimo
# 25 giorni per giro (~7 min l'uno); un recupero più lungo si fa con più giri.
# Trigger esterno: cron-job.org una volta al giorno alle 02:20 UTC, body {"ref":"main"}.
on:
  workflow_dispatch:
    inputs:
      dal:
        description: "Primo giorno (AAAA-MM-GG), vuoto = il primo ancora nello storico dell'API"
        required: false
      max_giorni:
        description: "Giorni al massimo in questo giro"
        required: false
        default: "25"

permissions:
  contents: write

concurrency:
  group: archivio-radar
  cancel-in-progress: false

jobs:
  archivia:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/archivio_radar.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dipendenze
        run: pip install "numpy<2.3" scipy pandas requests rasterio

      - name: Giorni già archiviati
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName -q '.[].tagName' | grep '^radar-' > tag.txt || true
          : > fatti.txt
          while read -r t; do gh release view "$t" --json assets -q '.assets[].name' >> fatti.txt; done < tag.txt
          wc -l < fatti.txt

      - name: Archivia e carica
        env:
          GH_TOKEN: ${{ github.token }}
          DAL: ${{ inputs.dal }}
          MAX: ${{ inputs.max_giorni || '25' }}
        run: |
          mkdir -p radar
          python scripts/archivio_radar.py --uscita radar --salta-esistenti fatti.txt --max-giorni "$MAX" \
            ${DAL:+--dal "$DAL"} | while read -r f; do
            n=$(basename "$f"); m=$(echo "$n" | sed -E 's/.*_([0-9]{4})([0-9]{2})[0-9]{2}\.npz/\1-\2/')
            gh release view "radar-$m" > /dev/null 2>&1 || \
              gh release create "radar-$m" --title "Radar DPC $m" \
                --notes "Radar DPC SRI sull'Italia, celle 0,05°, passo 5 min (scripts/archivio_radar.py). Fonte: Dipartimento della Protezione Civile, piattaforma radar (CC-BY-SA 4.0)." --latest=false
            gh release upload "radar-$m" "$f" --clobber && rm "$f"
          done

name: Ombra M2b (1–48 h, forecasts_shadow_m2b per la correzione M2c)

# Prova in ombra di M2b da 1 a 48 h, scritta in forecasts_shadow_m2b: la produzione (produce_m2.py) ne usa
# la storia per correggere M2b con il suo errore per stazione e ora (M2c). Nessun effetto diretto sulla mappa.
# Trigger esterno: cron-job.org alle 09:15 e 21:15 UTC (dopo i run IFS 00Z/12Z).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prova a vuoto: nessuna scrittura su Supabase (--dry-run)"
        type: boolean
        default: false

concurrency:
  group: shadow-m2
  cancel-in-progress: false

jobs:
  shadow-m2:
    name: Run shadow M2
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Modelli congelati dalla release privata di metek-core (tag e sha256 in models.lock).
      - name: Fetch models
        uses: ./.github/actions/fetch-models
        with:
          token: ${{ secrets.MODELS_TOKEN }}

      - name: "Setup Miniconda (env: meteo, Python 3.12)"
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: meteo
          python-version: "3.12"
          auto-activate-base: false
          use-mamba: true

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Dal 15/11/2026 resta solo M2b: la sua storia (forecasts_shadow_m2b) serve alla correzione M2c della
      # produzione (m2b_self_bias). Le ombre M2/H1 (forecasts_shadow) e H1b (forecasts_shadow_m2hb) sono
      # spente: M2c e H1b sono in produzione dal 09/11 e la dashboard legge forecasts_verifica. Il passo M2
      # veniva prima e, se falliva (es. 429 di Open-Meteo il 14/11 sera), saltava anche M2b.
      - name: Run shadow M2b
        timeout-minutes: 12
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          python3 model/shadow_m2b.py $DRY_RUN

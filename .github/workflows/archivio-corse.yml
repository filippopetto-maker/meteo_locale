name: Archivio corse modelli (Lazio, da Open-Meteo su AWS)

# Ogni 3 ore archivia le corse vere di ICON-2I, AROME HD, GFS, IFS, ICON-EU ed ensemble IFS sul Lazio
# allargato (scripts/archivio_corse.py) e le carica come asset della release del mese (corse-AAAA-MM).
# Riprendibile: salta le corse già caricate, quindi un giro saltato si recupera al successivo.
# Trigger esterno: cron-job.org ogni 3 h al minuto 40 UTC (il cron di GitHub saltava i giri), body {"ref":"main"}.
# A mano (workflow_dispatch) con "dal"/"al" si recupera il passato ancora presente su AWS (dal 25/07/2026).
on:
  workflow_dispatch:
    inputs:
      dal:
        description: "Prima data (AAAA-MM-GG), vuoto = ultimi 2 giorni"
        required: false
      al:
        description: "Ultima data (AAAA-MM-GG), vuoto = oggi"
        required: false

permissions:
  contents: write

concurrency:
  group: archivio-corse
  cancel-in-progress: false

jobs:
  archivia:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/archivio_corse.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dipendenze
        run: pip install "numpy<2.3" omfiles==1.2.0 s3fs

      - name: Corse già archiviate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName -q '.[].tagName' | grep '^corse-' > tag.txt || true
          : > fatti.txt
          while read -r t; do gh release view "$t" --json assets -q '.assets[].name' >> fatti.txt; done < tag.txt
          wc -l < fatti.txt

      - name: Archivia e carica
        env:
          GH_TOKEN: ${{ github.token }}
          DAL: ${{ inputs.dal }}
          AL: ${{ inputs.al }}
        run: |
          mkdir -p corse
          python scripts/archivio_corse.py --uscita corse --salta-esistenti fatti.txt \
            ${DAL:+--dal "$DAL"} ${AL:+--al "$AL"} | while read -r f; do
            n=$(basename "$f"); m=$(echo "$n" | sed -E 's/.*_([0-9]{4})([0-9]{2})[0-9]{4}\.npz/\1-\2/')
            gh release view "corse-$m" > /dev/null 2>&1 || \
              gh release create "corse-$m" --title "Corse modelli $m" \
                --notes "Corse vere sul Lazio allargato (scripts/archivio_corse.py). Fonte: Open-Meteo (CC-BY 4.0)." --latest=false
            gh release upload "corse-$m" "$f" --clobber && rm "$f"
          done

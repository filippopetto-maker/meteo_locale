name: export-static

on:
  workflow_dispatch:

concurrency:
  group: export-push
  cancel-in-progress: false

jobs:
  # Flusso storico: commit dei JSON su main, pubblicati da Pages "branch".
  # Resta attivo finché la variabile PAGES_SOURCE non vale "actions".
  export:
    if: vars.PAGES_SOURCE != 'actions'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 10

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install supabase pandas numpy scipy python-dotenv requests matplotlib

      - name: Run export
        run: |
          for i in 1 2 3; do
            python3 scripts/export_static.py && break
            echo "Attempt $i failed, retrying in 20s..."
            sleep 20
          done
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Commit and push static data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/wind_grid.json data/sst_cache.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica da committare"
            exit 0
          fi
          git commit -m "chore: update static data [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Push riuscito al tentativo $i"
              exit 0
            fi
            echo "Push tentativo $i fallito, retry in 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1

  # Nuovo flusso: nessun commit, deploy su Pages come artifact (publish.yml).
  publish:
    if: vars.PAGES_SOURCE == 'actions'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      mode: static
    secrets: inherit

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Meteo Roma</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Metek">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0e1119">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-panel: rgba(18, 22, 32, 0.94);
      --border-panel: rgba(255, 255, 255, 0.08);
      --text-primary: #e7ecf5;
      --text-secondary: #a7afc0;
      --text-muted: #8892a4;
      --accent: #2f6fe0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      position: fixed; inset: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0e1119;
    }
    #map { position: fixed; inset: 0; background: #0e1119; }

    /* ─── Pannello di controllo unico — top-left (iniettato da JS) ─── */
    #control-panel {
      position: fixed;
      top: 10px; /* fallback per browser senza supporto env() */
      top: calc(10px + env(safe-area-inset-top, 0px)); /* evita sovrapposizione con Dynamic Island/status bar in modalità PWA standalone */
      left: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg-panel);
      border: 0.5px solid var(--border-panel);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      max-width: calc(100vw - 20px);
      max-height: calc(100vh - 20px);
      overflow-y: auto;
    }

    .panel-head { display: flex; flex-direction: column; }
    .info-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .info-update { font-size: 11px; color: var(--text-secondary); }

    .panel-divider { height: 1px; background: var(--border-panel); }

    /* ─── Segmented control (layer + Adesso/+1h) ─── */
    .layer-toggle {
      display: flex;
      gap: 2px;
      padding: 2px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
    }
    .layer-toggle button {
      flex: 1;
      background: transparent;
      color: var(--text-secondary);
      border: none;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      white-space: nowrap;
      transition: background .15s ease, color .15s ease;
    }
    .layer-toggle button:hover:not(.active) {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
    }
    .layer-toggle button.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* ─── Switch iOS-like (Mostra vento / Frecce direzionali) ─── */
    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .ctrl-row:hover { color: var(--text-primary); }
    .ctrl-row input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .switch {
      position: relative;
      flex: 0 0 auto;
      width: 32px;
      height: 18px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.14);
      transition: background .18s ease;
    }
    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform .18s ease;
    }
    .ctrl-row input:checked ~ .switch { background: var(--accent); }
    .ctrl-row input:checked ~ .switch::after { transform: translateX(14px); }
    .ctrl-row input:focus-visible ~ .switch { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ─── Pillole radio (km/h — nodi) ─── */
    .pill-group {
      display: flex;
      gap: 2px;
      padding: 2px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      align-self: flex-start;
    }
    .pill { position: relative; cursor: pointer; }
    .pill input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .pill span {
      display: block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      transition: background .15s ease, color .15s ease;
    }
    .pill:hover input:not(:checked) + span { color: var(--text-primary); }
    .pill input:checked + span {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .pill input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ─── Link dashboard ─── */
    .dashboard-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 12px;
    }
    .dashboard-link:hover { color: var(--text-primary); }
    .dashboard-link .chevron { color: var(--text-muted); }

    /* ─── Legenda — bottom-right (gradiente e valori calcolati da JS) ─── */
    .temp-legend {
      position: fixed;
      bottom: 30px; /* fallback per browser senza supporto env() */
      bottom: calc(30px + env(safe-area-inset-bottom, 0px)); /* evita sovrapposizione con la home indicator di iOS */
      right: 10px;
      z-index: 1000;
      background: var(--bg-panel);
      border: 0.5px solid var(--border-panel);
      border-radius: 10px;
      color: var(--text-primary);
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12px;
      width: 160px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .temp-legend.legend-radar-mode {
      bottom: 118px; /* fallback per browser senza supporto env() */
      bottom: calc(118px + env(safe-area-inset-bottom, 0px));
    }
    .legend-title { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
    .legend-bar { height: 6px; border-radius: 3px; margin-bottom: 3px; }
    .legend-labels { position: relative; height: 1.2em; margin-top: 4px; }
    .legend-tick {
      position: absolute;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .legend-tick:first-child { transform: translateX(0); }
    .legend-tick:last-child  { transform: translateX(-100%); }

    /* ─── Popup Leaflet in tema scuro ─── */
    .meteo-popup .leaflet-popup-content-wrapper {
      background: var(--bg-panel);
      color: var(--text-primary);
      border: 0.5px solid var(--border-panel);
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    }
    .meteo-popup .leaflet-popup-content {
      margin: 10px 12px;
      font-size: 12px;
      line-height: 1.6;
    }
    .meteo-popup .leaflet-popup-content > b:first-child {
      font-size: 13px;
      font-weight: 600;
    }
    .meteo-popup .leaflet-popup-tip {
      background: var(--bg-panel);
      border: 0.5px solid var(--border-panel);
      box-shadow: none;
    }
    .meteo-popup .leaflet-popup-close-button { color: var(--text-muted); }
    .meteo-popup .leaflet-popup-close-button:hover { color: var(--text-primary); }

    /* ─── Controlli Leaflet in tema scuro ─── */
    .leaflet-bar a, .leaflet-bar a:hover {
      background: var(--bg-panel);
      color: var(--text-primary);
      border-bottom: 0.5px solid var(--border-panel);
    }
    .leaflet-bar a:hover { background: #1c2130; }
    .leaflet-control-attribution {
      background: rgba(18, 22, 32, 0.8) !important;
      color: var(--text-muted) !important;
      font-size: 10px;
    }
    .leaflet-control-attribution a { color: var(--text-secondary) !important; }

    /* ─── Barra temporale Radar — bottom, visibile solo con layer Radar ─── */
    .radar-timeline {
      position: fixed;
      left: 50%;
      bottom: 16px; /* fallback per browser senza supporto env() */
      bottom: calc(16px + env(safe-area-inset-bottom, 0px)); /* evita sovrapposizione con la home indicator di iOS */
      transform: translateX(-50%);
      z-index: 1000;
      width: min(640px, calc(100vw - 20px));
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--bg-panel);
      border: 0.5px solid var(--border-panel);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-primary);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .radar-timeline-row { display: flex; align-items: center; gap: 10px; }
    .radar-play-btn {
      flex: 0 0 auto;
      width: 28px; height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .radar-play-btn:hover { filter: brightness(1.1); }
    .radar-track-wrap { position: relative; flex: 1; height: 18px; display: flex; align-items: center; }
    .radar-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.25);
      outline: none;
      cursor: pointer;
    }
    .radar-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--accent);
      cursor: pointer;
    }
    .radar-slider::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--accent);
      cursor: pointer;
    }
    .radar-now-marker {
      position: absolute;
      top: -3px;
      width: 2px; height: 10px;
      background: #fff;
      transform: translateX(-1px);
      pointer-events: none;
    }
    .radar-timeline-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--text-secondary);
    }
    .radar-timeline-labels #radar-label-now { color: var(--text-primary); font-weight: 600; }
    .radar-unavailable { font-size: 12px; color: var(--text-secondary); text-align: center; padding: 4px 0; }
    .radar-credit { font-size: 10px; color: var(--text-muted); text-align: right; }
    .radar-credit a { color: var(--text-secondary); }
    .radar-note { cursor: help; text-decoration: underline dotted; }

    @media (max-width: 480px) {
      #control-panel {
        right: 10px;
        gap: 6px;
        padding: 8px 10px;
        font-size: 12px;
      }
      .layer-toggle button { padding: 5px 6px; font-size: 11px; }
      .temp-legend {
        width: 140px;
        bottom: 20px; /* fallback per browser senza supporto env() */
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      }
      .temp-legend.legend-radar-mode {
        bottom: 100px; /* fallback per browser senza supporto env() */
        bottom: calc(100px + env(safe-area-inset-bottom, 0px));
      }
      .radar-timeline {
        padding: 8px 10px;
        bottom: 10px; /* fallback per browser senza supporto env() */
        bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      }
    }

    /* ════════════════════════════════════════════════════════════════════
       Redesign "Metek" — attivo SOLO quando <html> ha classe .is-pwa
       (PWA standalone installata da Home Screen, vedi script in <head>).
       Tutto il CSS sopra questo blocco resta invariato e attivo di default
       per qualunque visita da browser normale, a qualunque larghezza.
       ════════════════════════════════════════════════════════════════════ */

    /* ─── Splash — nascosto di default, visibile solo in .is-pwa ─── */
    #splash { display: none; }
    .is-pwa #splash {
      display: flex;
      position: fixed; inset: 0; z-index: 9999;
      flex-direction: column; align-items: center; justify-content: center; gap: 30px;
      background: radial-gradient(90% 70% at 50% 38%, #1e2138 0%, #141626 55%, #0e1119 100%);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .is-pwa #splash svg { display: block; width: 152px; height: 152px; }
    .is-pwa #splash .iso {
      fill: none; stroke-linecap: round; stroke-width: 7;
      stroke-dasharray: 520; stroke-dashoffset: 520;
      animation: splash-draw 1.25s cubic-bezier(.22, .61, .36, 1) forwards;
    }
    .is-pwa #splash .iso:nth-child(2) { animation-delay: .08s; }
    .is-pwa #splash .iso:nth-child(3) { animation-delay: .16s; }
    .is-pwa #splash .iso:nth-child(4) { animation-delay: .24s; }
    .is-pwa #splash .iso:nth-child(5) { animation-delay: .32s; }
    .is-pwa #splash .hot { animation: splash-pulse 1.6s ease-in-out .5s infinite; }
    .is-pwa #splash .word {
      font-weight: 500; font-size: 30px; line-height: 1; letter-spacing: .01em; color: #e9e9ed;
      opacity: 0; transform: translateY(8px);
      animation: splash-word .5s ease-out .95s forwards;
    }
    .is-pwa #splash .track {
      position: absolute; bottom: 78px; left: 50%; transform: translateX(-50%);
      width: 96px; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, .1);
      overflow: hidden;
    }
    .is-pwa #splash .bar {
      height: 100%; width: 0; background: #9184d9;
      animation: splash-bar 1.7s ease-in-out forwards;
    }
    .is-pwa #splash.done { opacity: 0; pointer-events: none; transition: opacity .32s ease; }
    @keyframes splash-draw { to { stroke-dashoffset: 0; } }
    @keyframes splash-word { to { opacity: 1; transform: none; } }
    @keyframes splash-bar { to { width: 100%; } }
    @keyframes splash-pulse {
      0%, 100% { opacity: .4; transform: scale(.9); }
      50%      { opacity: 1;  transform: scale(1.06); }
    }
    @media (prefers-reduced-motion: reduce) {
      .is-pwa #splash .iso { animation: none; stroke-dashoffset: 0; }
      .is-pwa #splash .word { animation: none; opacity: 1; transform: none; }
      .is-pwa #splash .bar { animation: none; width: 100%; }
      .is-pwa #splash .hot { animation: none; }
    }

    /* ─── Design tokens nuovi — solo dentro lo scope .is-pwa ─── */
    .is-pwa {
      --accent: #9184d9;
      --accent-press: rgba(145, 132, 217, .28);
      --accent-fill: rgba(145, 132, 217, .18);
      --accent-on: #14121f;
      --accent-100: #c6bff0;
      --accent-300: #9184d9;
      --accent-500: #7b76cc;
      --accent-700: #5b63b4;
      --accent-900: #3f4a86;
      --warm: #f4a93f;
      --bg: #0e1119;
      --bg-ds: #161826;
      --glass: rgba(20, 22, 34, .86);
      --glass-strong: rgba(20, 22, 34, .93);
      --glass-soft: rgba(22, 24, 38, .72);
      --border: rgba(255, 255, 255, .12);
      --border-soft: rgba(255, 255, 255, .09);
      --text: #e9e9ed;
      --text-2: rgba(233, 233, 237, .85);
      --text-3: rgba(233, 233, 237, .55);
      --text-off: rgba(233, 233, 237, .52);
      /* Diagnostica round 4: espone i valori env() come custom property leggibili da JS
         (getComputedStyle), per verificare se risolvono a 0 al primo paint su iOS standalone
         e si correggono solo dopo un reflow. Vedi log temporaneo in app.js. */
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    /* ─── Altezza viewport iPhone standalone — approccio vh/dvh ABBANDONATO.
           Diagnosi (numeri del log round 6, iPhone 390×844pt): innerHeight,
           visualViewport.height e map.getSize() riportano staticamente 797 invece di
           844 fin dal primo frame, rotazioni incluse. Lo scarto di 47px è esattamente
           safe-area-inset-top (notch/Dynamic Island). Non è un valore che si assesta
           male dopo un evento mancato (ipotesi dei round 5/6): WebKit lo considera
           definitivo dal boot, quindi nessun ricalcolo d'altezza — vh, dvh, innerHeight,
           resize/ResizeObserver — potrà correggerlo. Fix: html/body/#map usano
           position:fixed; inset:0 (vedi sopra), riempiono il layout viewport reale senza
           mai passare da un'altezza calcolata. Vale identico in PWA e in browser, quindi
           non serve più una regola .is-pwa dedicata. env(safe-area-inset-*) resta usato
           altrove per il padding dei controlli: quello era ed è corretto. ─── */

    /* ─── Brand lockup (top-left) ─── */
    .is-pwa #brand-lockup {
      display: flex; align-items: center; gap: 8px;
      position: fixed;
      top: 9px; /* fallback per browser senza supporto env() */
      top: calc(env(safe-area-inset-top, 0px) + 9px);
      left: 14px;
      z-index: 1000;
      max-width: calc(100vw - 150px); /* rete di sicurezza: non invadere mai la pillola tempo */
      text-shadow: 0 1px 6px rgba(0, 0, 0, .85);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .is-pwa #brand-lockup .brand-mark {
      width: 26px; height: 26px; flex: 0 0 auto;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .6));
    }
    .is-pwa #brand-lockup .brand-text { min-width: 0; } /* consente all'ellipsis di funzionare in un flex item */
    .is-pwa #brand-lockup .brand-word {
      font-weight: 500; font-size: 13px; letter-spacing: -.01em; color: var(--text);
    }
    .is-pwa #brand-meta,
    .is-pwa #info-radar {
      display: block;
      font-weight: 400; font-size: 9.5px; color: var(--text-3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ─── Pillola tempo (top-right), sostituisce #time-toggle in PWA ─── */
    .is-pwa #time-toggle {
      display: flex; gap: 2px; padding: 3px; border-radius: 999px;
      background: rgba(20, 22, 34, .8); border: .5px solid rgba(255, 255, 255, .1);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      position: fixed;
      top: 9px;
      top: calc(env(safe-area-inset-top, 0px) + 9px);
      right: 14px;
      z-index: 1000;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .is-pwa #time-toggle button {
      font-family: inherit; border: none; background: transparent; cursor: pointer;
      padding: 6px 13px; border-radius: 999px; min-height: 32px;
      font-weight: 600; font-size: 11.5px; color: var(--text-off);
    }
    .is-pwa #time-toggle button.active { background: var(--accent); color: var(--accent-on); }

    /* ─── Rail layer (bottom-center) ─── */
    .is-pwa #layer-rail {
      display: flex; align-items: center; gap: 3px; padding: 4px; border-radius: 999px;
      background: var(--glass); border: .5px solid var(--border);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .55);
      position: fixed;
      left: 50%; transform: translateX(-50%);
      bottom: 44px;
      z-index: 1000;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .is-pwa .rail-item {
      width: 68px; height: 52px; border-radius: 999px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      background: transparent; border: none; cursor: pointer; color: var(--text-off);
      font-family: inherit;
    }
    .is-pwa .rail-item svg { width: 20px; height: 20px; }
    .is-pwa .rail-item span { font-weight: 500; font-size: 9.5px; }
    .is-pwa .rail-item.active { background: var(--accent-fill); color: var(--accent-100); }
    .is-pwa .rail-item:active { background: var(--accent-press); }
    .is-pwa #rail-divider { width: .5px; height: 30px; background: rgba(255, 255, 255, .14); margin: 0 1px; }
    .is-pwa #prefs-btn {
      width: 48px; height: 52px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; cursor: pointer; color: var(--text-off);
    }
    .is-pwa #prefs-btn svg { width: 21px; height: 21px; }
    .is-pwa #prefs-btn.active { background: var(--accent-fill); color: var(--accent-100); }

    /* ─── Popover preferenze — riusa .ctrl-row/.switch/.pill-group/.pill/.dashboard-link
           (stessi id/markup del pannello legacy, solo skin diversa qui sotto) ─── */
    .is-pwa #prefs-popover {
      position: fixed; right: 14px; bottom: 112px; z-index: 1000;
      width: 232px; padding: 12px 14px; border-radius: 18px;
      background: var(--glass-strong); border: .5px solid var(--border);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 18px 46px rgba(0, 0, 0, .6);
      display: flex; flex-direction: column; gap: 2px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .is-pwa #prefs-popover.hidden { display: none; }
    .is-pwa #prefs-popover::after {
      content: ''; position: absolute; right: 32px; bottom: -6px;
      width: 12px; height: 12px; transform: rotate(45deg);
      background: var(--glass-strong);
      border-right: .5px solid var(--border); border-bottom: .5px solid var(--border);
    }
    .is-pwa #prefs-popover .ctrl-row {
      display: flex; align-items: center; justify-content: space-between;
      min-height: 30px; font-size: 12.5px; color: var(--text-2);
    }

  <script>
    // Redesign "Metek" (splash, brand lockup, rail, popover) attivo SOLO in PWA standalone
    // installata da Home Screen — mai per visite browser normali (desktop, Safari non
    // installato, iPad non installato). Eseguito qui, prima che <body> venga parsato, per
    // evitare qualunque flash in entrambe le direzioni.
    document.documentElement.classList.toggle('is-pwa',
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true);
  </script>

<body>
  <!-- Splash "Metek" — visibile solo in PWA standalone (.is-pwa su <html>, vedi <head>).
       Porting da splash-reference.html dell'handoff di design. -->
  <div id="splash">
    <svg viewBox="0 0 180 180">
      <path class="iso" d="M-6 150c26-40 60-30 88-46s34-46 68-52" stroke="#3f4a86"/>
      <path class="iso" d="M-6 126c30-38 58-26 86-44s36-42 70-48" stroke="#5b63b4"/>
      <path class="iso" d="M2 104c28-34 54-22 80-40s34-38 66-44" stroke="#7b76cc"/>
      <path class="iso" d="M16 84c24-28 46-16 70-34s30-32 62-38" stroke="#9184d9"/>
      <path class="iso" d="M34 68c20-22 38-10 58-28s26-24 56-30" stroke="#c6bff0"/>
      <circle class="hot" cx="104" cy="52" r="16" fill="#f4a93f" style="transform-origin:104px 52px"/>
    </svg>
    <div class="word">Metek</div>
    <div class="track"><div class="bar"></div></div>
  </div>
  <script>
    // Espone window.hideSplash(), chiamata da app.js a fine caricamento dati (successo o
    // errore). Durata minima 1.7s per non "sfarfallare". No-op immediato fuori da .is-pwa.
    (function () {
      if (!document.documentElement.classList.contains('is-pwa')) {
        window.hideSplash = function () {};
        return;
      }
      var splash = document.getElementById('splash');
      var MIN_MS = 1700;
      var t0 = performance.now();
      window.hideSplash = function () {
        var wait = Math.max(0, MIN_MS - (performance.now() - t0));
        setTimeout(function () {
          splash.classList.add('done');
          setTimeout(function () { splash.remove(); }, 340);
        }, wait);
      };
    })();
  </script>

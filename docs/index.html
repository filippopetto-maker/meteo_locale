<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Meteo Roma</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meteo Locale">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0e1119">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-panel: rgba(18, 22, 32, 0.94);
      --border-panel: rgba(255, 255, 255, 0.08);
      --text-primary: #e7ecf5;
      --text-secondary: #a7afc0;
      --text-muted: #8892a4;
      --accent: #2f6fe0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0e1119;
    }
    #map { height: 100vh; width: 100vw; background: #0e1119; }

    /* ─── Pannello di controllo unico — top-left (iniettato da JS) ─── */
    #control-panel {
      position: fixed;
      top: 10px; /* fallback per browser senza supporto env() */
      top: calc(10px + env(safe-area-inset-top, 0px)); /* evita sovrapposizione con Dynamic Island/status bar in modalità PWA standalone */
      left: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--bg-panel);
      border: 0.5px solid var(--border-panel);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      max-width: calc(100vw - 20px);
      max-height: calc(100vh - 20px);
      overflow-y: auto;
    }

    .panel-head { display: flex; flex-direction: column; }
    .info-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .info-update { font-size: 11px; color: var(--text-secondary); }

    .panel-divider { height: 1px; background: var(--border-panel); }

    /* ─── Segmented control (layer + Adesso/+1h) ─── */
    .layer-toggle {
      display: flex;
      gap: 2px;
      padding: 2px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
    }
    .layer-toggle button {
      flex: 1;
      background: transparent;
      color: var(--text-secondary);
      border: none;
      padding: 5px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      white-space: nowrap;
      transition: background .15s ease, color .15s ease;
    }
    .layer-toggle button:hover:not(.active) {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
    }
    .layer-toggle button.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* ─── Switch iOS-like (Mostra vento / Frecce direzionali) ─── */
    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .ctrl-row:hover { color: var(--text-primary); }
    .ctrl-row input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .switch {
      position: relative;
      flex: 0 0 auto;
      width: 32px;
      height: 18px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.14);
      transition: background .18s ease;
    }
    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform .18s ease;
    }
    .ctrl-row input:checked ~ .switch { background: var(--accent); }
    .ctrl-row input:checked ~ .switch::after { transform: translateX(14px); }
    .ctrl-row input:focus-visible ~ .switch { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ─── Pillole radio (km/h — nodi) ─── */
    .pill-group {
      display: flex;
      gap: 2px;
      padding: 2px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      align-self: flex-start;
    }
    .pill { position: relative; cursor: pointer; }
    .pill input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .pill span {
      display: block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      transition: background .15s ease, color .15s ease;
    }
    .pill:hover input:not(:checked) + span { color: var(--text-primary); }
    .pill input:checked + span {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .pill input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ─── Link dashboard ─── */
    .dashboard-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 12px;
    }
    .dashboard-link:hover { color: var(--text-primary); }
    .dashboard-link .chevron { color: var(--text-muted); }

    /* ─── Legenda — bottom-right (gradiente e valori calcolati da JS) ─── */
    .temp-legend {
      position: fixed;
      bottom: 30px; /* fallback per browser senza supporto env() */
      bottom: calc(30px + env(safe-area-inset-bottom, 0px)); /* evita sovrapposizione con la home indicator di iOS */
      right: 10px;
      z-index: 1000;
      background: var(--bg-panel);
      border: 0.5px solid var(--border-panel);
      border-radius: 10px;
      color: var(--text-primary);
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12px;
      width: 160px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .temp-legend.legend-radar-mode {
      bottom: 118px; /* fallback per browser senza supporto env() */
      bottom: calc(118px + env(safe-area-inset-bottom, 0px));
    }
    .legend-title { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
    .legend-bar { height: 6px; border-radius: 3px; margin-bottom: 3px; }
    .legend-labels { position: relative; height: 1.2em; margin-top: 4px; }
    .legend-tick {
      position: absolute;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .legend-tick:first-child { transform: translateX(0); }
    .legend-tick:last-child  { transform: translateX(-100%); }

    /* ─── Popup Leaflet in tema scuro ─── */
    .meteo-popup .leaflet-popup-content-wrapper {
      background: var(--bg-panel);
      color: var(--text-primary);
      border: 0.5px solid var(--border-panel);
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    }
    .meteo-popup .leaflet-popup-content {
      margin: 10px 12px;
      font-size: 12px;
      line-height: 1.6;
    }
    .meteo-popup .leaflet-popup-content > b:first-child {
      font-size: 13px;
      font-weight: 600;
    }
    .meteo-popup .leaflet-popup-tip {
      background: var(--bg-panel);
      border: 0.5px solid var(--border-panel);
      box-shadow: none;
    }
    .meteo-popup .leaflet-popup-close-button { color: var(--text-muted); }
    .meteo-popup .leaflet-popup-close-button:hover { color: var(--text-primary); }

    /* ─── Controlli Leaflet in tema scuro ─── */
    .leaflet-bar a, .leaflet-bar a:hover {
      background: var(--bg-panel);
      color: var(--text-primary);
      border-bottom: 0.5px solid var(--border-panel);
    }
    .leaflet-bar a:hover { background: #1c2130; }
    .leaflet-control-attribution {
      background: rgba(18, 22, 32, 0.8) !important;
      color: var(--text-muted) !important;
      font-size: 10px;
    }
    .leaflet-control-attribution a { color: var(--text-secondary) !important; }

    /* ─── Barra temporale Radar — bottom, visibile solo con layer Radar ─── */
    .radar-timeline {
      position: fixed;
      left: 50%;
      bottom: 16px; /* fallback per browser senza supporto env() */
      bottom: calc(16px + env(safe-area-inset-bottom, 0px)); /* evita sovrapposizione con la home indicator di iOS */
      transform: translateX(-50%);
      z-index: 1000;
      width: min(640px, calc(100vw - 20px));
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--bg-panel);
      border: 0.5px solid var(--border-panel);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-primary);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .radar-timeline-row { display: flex; align-items: center; gap: 10px; }
    .radar-play-btn {
      flex: 0 0 auto;
      width: 28px; height: 28px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .radar-play-btn:hover { filter: brightness(1.1); }
    .radar-track-wrap { position: relative; flex: 1; height: 18px; display: flex; align-items: center; }
    .radar-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.25);
      outline: none;
      cursor: pointer;
    }
    .radar-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--accent);
      cursor: pointer;
    }
    .radar-slider::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--accent);
      cursor: pointer;
    }
    .radar-now-marker {
      position: absolute;
      top: -3px;
      width: 2px; height: 10px;
      background: #fff;
      transform: translateX(-1px);
      pointer-events: none;
    }
    .radar-timeline-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--text-secondary);
    }
    .radar-timeline-labels #radar-label-now { color: var(--text-primary); font-weight: 600; }
    .radar-unavailable { font-size: 12px; color: var(--text-secondary); text-align: center; padding: 4px 0; }
    .radar-credit { font-size: 10px; color: var(--text-muted); text-align: right; }
    .radar-credit a { color: var(--text-secondary); }
    .radar-note { cursor: help; text-decoration: underline dotted; }

    @media (max-width: 480px) {
      #control-panel {
        right: 10px;
        gap: 6px;
        padding: 8px 10px;
        font-size: 12px;
      }
      .layer-toggle button { padding: 5px 6px; font-size: 11px; }
      .temp-legend {
        width: 140px;
        bottom: 20px; /* fallback per browser senza supporto env() */
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      }
      .temp-legend.legend-radar-mode {
        bottom: 100px; /* fallback per browser senza supporto env() */
        bottom: calc(100px + env(safe-area-inset-bottom, 0px));
      }
      .radar-timeline {
        padding: 8px 10px;
        bottom: 10px; /* fallback per browser senza supporto env() */
        bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-velocity@2.1.1/dist/leaflet-velocity.min.js"></script>
  <script src="js/radar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
